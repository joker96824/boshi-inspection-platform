version: '3.8'

services:
  # 博实智能巡检平台应用
  # 注意：数据库和Redis使用外部服务，不在Docker容器中运行
  app:
    image: boshi-inspection-platform:1.0
    container_name: boshi-app
    restart: always
    # 不再依赖内部数据库服务
    environment:
      # 数据库配置 - 必须通过外部.env文件配置外部数据库连接
      # MySQL 格式: mysql+aiomysql://用户名:密码@主机:端口/数据库名
      # PostgreSQL 格式: postgresql+asyncpg://用户名:密码@主机:端口/数据库名
      DATABASE_URL: ${DATABASE_URL:-mysql+aiomysql://boshi:password@192.168.1.100:3306/boshirobot}
      
      # Redis配置（可选，默认禁用）
      # 如需启用Redis，设置 REDIS_ENABLED=true 并配置 REDIS_URL
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://192.168.1.100:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      
      # 应用配置
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      
      # ROS2配置
      ROS2_ENABLED: ${ROS2_ENABLED:-true}
      ROS2_DOMAIN_ID: ${ROS2_DOMAIN_ID:-0}
      
      # 时区
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./docs:/app/docs:ro
    # 使用 host 网络模式以便访问宿主机上的数据库服务
    # 如果数据库在远程服务器，可以保持 bridge 模式
    network_mode: ${NETWORK_MODE:-bridge}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


